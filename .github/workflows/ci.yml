name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  app:
    name: App (Format, Analyse, Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generierter Datenbank-Code aktuell?
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - name: Formatierung (ohne generierten Code)
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart')
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android-Build (${{ matrix.flavor }})
    needs: app
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [fdroid, play]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug --flavor ${{ matrix.flavor }}
      - uses: actions/upload-artifact@v4
        with:
          name: muscale-${{ matrix.flavor }}-debug-apk
          path: app/build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-debug.apk
          retention-days: 7
