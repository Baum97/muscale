name: Release

# Baut die Veröffentlichungs-Pakete:
# - Google Play: App Bundle (AAB), Flavor „play“
# - GitHub/F-Droid-Vorschau: APK, Flavor „fdroid“
# Signiert mit dem Upload-Schlüssel aus den GitHub-Secrets (siehe docs/VEROEFFENTLICHUNG.md).
# Ohne Secrets entstehen unsignierte Pakete (zum Prüfen, nicht zum Hochladen).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build:
    name: Release-Pakete bauen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Upload-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSCALE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Keine Signier-Secrets – die Pakete sind unsigniert und nicht für Google Play geeignet."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "MUSCALE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Pakete bauen
        env:
          MUSCALE_KEYSTORE_PASSWORD: ${{ secrets.MUSCALE_KEYSTORE_PASSWORD }}
          MUSCALE_KEY_ALIAS: ${{ secrets.MUSCALE_KEY_ALIAS }}
          MUSCALE_KEY_PASSWORD: ${{ secrets.MUSCALE_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build appbundle --release --flavor play
          flutter build apk --release --flavor fdroid
          mkdir -p ../release
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "../release/muscale-$version-play.aab"
          cp build/app/outputs/flutter-apk/app-fdroid-release.apk "../release/muscale-$version.apk"
          ls -la ../release
      - name: Kein Google-Code in der F-Droid-Variante
        working-directory: .
        run: scripts/check-fdroid-apk.sh release/muscale-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: muscale-release
          path: release/
          retention-days: 30
      - name: GitHub-Release anlegen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
